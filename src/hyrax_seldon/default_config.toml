[model.HyraxSeldon]
# Path to a SELDON run config: the hparams.yaml of a SELDON training run, or the
# seldon_config.yaml that HyraxSeldon saves next to its weights.
# It supplies the architecture, the preprocessing settings and statistics, and the
# class map. REQUIRED.
seldon_config = false

# Keep the torch compile() calls SELDON makes in its model constructors.
compile = false

# hyrax_alerts settings that BabamulLsstConsumer and process_alerts read. hyrax_alerts' own
# defaults are only merged when a config names one of its classes, so they are repeated here.
[hyrax_alerts.consumer]
# Stop process_alerts after this many alerts; false means no limit.
alert_limit = false

[hyrax_alerts.consumer.BabamulConsumer]
# Keep alerts as raw dicts.
raw_alert = false
