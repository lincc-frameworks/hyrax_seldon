[model.HyraxSeldon]
# Path to a SELDON run config: the hparams.yaml of a SELDON training run, or the
# seldon_config.yaml that HyraxSeldon saves next to its weights.
# It supplies the architecture, the preprocessing settings and statistics, and the
# class map. REQUIRED.
seldon_config = false

# Keep the torch compile() calls SELDON makes in its model constructors, so SELDON runs as
# compiled code (about twice as fast on a GPU) rather than eagerly.
#
# Compiling costs time up front, in the first batch of each run: about a minute and a half on
# an NCSA DeltaAI GH200 with an empty compile cache (SELDON asks torch to autotune its kernels),
# and well under a minute once torch's compile cache holds this model's kernels. A batch of a
# new size compiles again, so a run whose last batch is smaller than batch_size pays this
# again at its end, with an empty cache several minutes. The cache is kept between runs in
# TORCHINDUCTOR_CACHE_DIR (by default under /tmp); point it somewhere persistent to reuse it
# across jobs. Set false for small runs, where compiling takes longer than it saves.
#
# Compiling needs a C++ compiler: torch uses $CXX, or g++ if CXX is unset.
compile = true

mjd_field_name = "MJD"
flux_field_name = "FLUXCAL"
flux_err_field_name = "FLUXCALERR"
band_field_name = "BAND"
phot_flag_field_name = "PHOTFLAG"

# hyrax_alerts settings that BabamulLsstConsumer and process_alerts read. hyrax_alerts' own
# defaults are only merged when a config names one of its classes, so they are repeated here.
[hyrax_alerts.consumer]
# Stop process_alerts after this many alerts; false means no limit.
alert_limit = false

[hyrax_alerts.consumer.BabamulConsumer]
# Keep alerts as raw dicts.
raw_alert = false
